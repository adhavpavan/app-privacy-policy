<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Privacy Policies</title>
<meta name="color-scheme" content="light dark">
<style>
  :root { --page:#f6f8fb; --card:#fff; --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --brand:#3b82f6; }
  @media (prefers-color-scheme: dark) { :root { --page:#0b1018; --card:#121a26; --ink:#e5ebf3; --muted:#9aa8bb; --line:#223044; --brand:#6ea4ff; } }
  body { margin:0; background:var(--page); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 20px; }
  a.app { display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; color:var(--ink); text-decoration:none; }
  a.app:hover { border-color:var(--brand); }
  a.app span { display:block; color:var(--muted); font-size:.92rem; }
</style>
</head>
<body>
<main class="wrap">
  <h1>App Privacy Policies</h1>
  <p>Privacy policies for Android apps by TechDev. Contact: <a href="mailto:tecdroiddeveloper@gmail.com">tecdroiddeveloper@gmail.com</a></p>
  <a class="app" href="focused/"><strong>Focused: Screen Time Control</strong><span>com.techdev.focused</span></a>
  <a class="app" href="corelyze/"><strong>Corelyze: CPU &amp; Device Info</strong><span>com.techdev.corelyze</span></a>
  <a class="app" href="chargewise/"><strong>Chargewise: Battery Health</strong><span>com.techdev.chargewise</span></a>
</main>
</body>
</html>
